<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OFFSIDE</title>
<meta name="description" content="架空のサッカークラブのオーナーとなり、あらゆる手を使って頂点を目指す経営ノワール。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 常設トップバー(タイトル以外で表示) -->
<header class="topbar hidden" id="topbar">
  <div class="wrap">
    <div class="logo"><i></i>OFFSIDE</div>
    <div class="wk">WEEK <b>01</b> / 14</div>
    <div class="sp"></div>
    <div class="res"></div>
  </div>
</header>

<!-- タイトル -->
<section class="screen on" id="s-title">
  <div class="wrap" style="max-width:560px">
    <div class="big"><span class="flag"></span>OFFSIDE</div>
    <div class="tag">V E S C A R A ・ S E R I E ・ S E C O N D A</div>
    <p class="lede">二部の没落クラブ、US ヴェラルド。正攻法で上がれる戦力はない。審判を買い、相手を削り、追う者を黙らせ ―― 捕まる前に、頂点へ。</p>
    <div class="menu">
      <button id="btn-new">新しく始める <small>NEW GAME</small></button>
      <button id="btn-continue">続きから <small>CONTINUE</small></button>
      <button id="btn-howto">遊び方 <small>HOW TO PLAY</small></button>
      <button id="btn-settings">設定 <small>SETTINGS</small></button>
    </div>
  </div>
</section>

<!-- 開始設定 -->
<section class="screen" id="s-setup">
  <div class="wrap"><div class="setup" id="setup-root"></div></div>
</section>

<!-- デスク(案件) -->
<section class="screen" id="s-office">
  <div class="wrap">
    <div class="desk-objective" id="desk-objective"></div>
    <div class="desk-tools">
      <button id="tool-table"><kbd>T</kbd>順位表</button>
      <button id="tool-money">財政</button>
      <button id="tool-file"><kbd>F</kbd>手駒と追及</button>
      <button id="tool-squad">選手</button>
    </div>
    <div class="desk-cards" id="desk-cards"></div>
  </div>
  <div class="actionbar">
    <div class="wrap">
      <button class="abtn go wide" id="desk-advance"></button>
    </div>
  </div>
</section>

<!-- ファイル(裏・参照) -->
<section class="screen" id="s-file">
  <div class="wrap">
    <article class="file">
      <div class="file-in">
        <div class="file-head">
          <div><div class="ttl" id="file-title">案件綴</div><div class="meta" id="file-meta"></div></div>
          <div class="stamp" id="file-stamp">極秘</div>
        </div>
        <div class="cols">
          <section><div class="sec"><b>手駒</b>Personnel</div><div id="file-roster"></div></section>
          <section><div class="sec"><b>追及</b>Pursuers</div><div class="pursuer" id="file-pursuers"></div></section>
        </div>
        <div class="file-actions">
          <button class="fbtn back" id="file-back">デスクに戻る</button>
        </div>
      </div>
    </article>
  </div>
</section>

<!-- 試合 -->
<section class="screen" id="s-match">
  <div class="wrap"><div id="match-root"></div></div>
</section>

<!-- 新聞 -->
<section class="screen" id="s-news">
  <div class="wrap" style="max-width:720px"><div id="news-root"></div></div>
</section>

<!-- 終幕 -->
<section class="screen" id="s-end">
  <div class="wrap" style="max-width:560px"><div id="end-root"></div></div>
</section>

<script type="module" src="js/main.js"></script>
<script>
  // タイトル以外ではトップバーを出す
  const bar = document.getElementById('topbar');
  const obs = new MutationObserver(() => {
    const t = document.getElementById('s-title');
    const setup = document.getElementById('s-setup');
    bar.classList.toggle('hidden', (t && t.classList.contains('on')) || (setup && setup.classList.contains('on')));
  });
  document.querySelectorAll('.screen').forEach((s) => obs.observe(s, { attributes: true, attributeFilter: ['class'] }));
</script>
</body>
</html>
